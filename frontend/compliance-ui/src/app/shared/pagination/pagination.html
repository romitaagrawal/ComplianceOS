<div class="pagination-bar" *ngIf="totalItems > 0">
  <div class="pagination-left">
    <span class="pagination-info">Showing {{ startItem }}–{{ endItem }} of {{ totalItems }}</span>
    <div class="pagination-size">
      <label for="pageSizeSelect">Rows:</label>
      <select id="pageSizeSelect" [ngModel]="pageSize" (ngModelChange)="onPageSizeChange($event)">
        <option *ngFor="let size of pageSizeOptions" [ngValue]="size">{{ size }}</option>
      </select>
    </div>
  </div>

  <div class="pagination-controls">
    <button type="button" class="page-nav-btn" (click)="goPrev()" [disabled]="currentPage === 1" aria-label="Previous page">
      <span class="material-symbols-outlined">chevron_left</span>
    </button>

    <ng-container *ngFor="let p of pageNumbers">
      <button
        *ngIf="p !== '...'"
        type="button"
        class="page-num-btn"
        [class.is-active]="p === currentPage"
        (click)="goTo(p)">
        {{ p }}
      </button>
      <span *ngIf="p === '...'" class="page-ellipsis">…</span>
    </ng-container>

    <button type="button" class="page-nav-btn" (click)="goNext()" [disabled]="currentPage === totalPages" aria-label="Next page">
      <span class="material-symbols-outlined">chevron_right</span>
    </button>
  </div>
</div>
